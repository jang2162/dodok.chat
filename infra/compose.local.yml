# 이 Mac 의 로컬 검증 전용 겹침 파일(스펙 9장) — 호스트에 여는 포트는 127.0.0.1:8443 하나. 실행은 저장소 루트에서:
#   docker compose --env-file infra/local.env -f infra/compose.yml -f infra/compose.local.yml up -d --build
#   (가짜 Gateway·플러그인으로 웹 전체를 볼 때) DODOK_UPSTREAM=devfake:3000 docker compose … --profile devfake up -d --build
# infra/local.env 는 infra/local.env.example 을 복사해 만든다(커밋 금지). app 의 env_file 이면서 --env-file(변수 치환)이기도 한
# 까닭: compose.yml 의 ${DODOK_DOMAIN:?} 치환은 파일을 합치기 전에 돌아서, 아래 caddy.environment 가 덮어도 값이 없으면 먼저 멈춘다.
# ps·logs·exec·down 도 같은 --env-file·-f 조합으로 부른다
services:
  app:
    env_file: !override [./local.env]
  caddy:
    environment:
      DODOK_DOMAIN: localhost
      CADDY_LOCAL_CERTS: local_certs
      DODOK_UPSTREAM: ${DODOK_UPSTREAM:-app:3000}
    ports: !override ["127.0.0.1:8443:443"] # 이 Mac 에만 — devfake 프로필은 고정 로그인 토큰이라 LAN 에 열면 누구나 들어온다
  devfake:
    profiles: [devfake]
    build: { context: .., dockerfile: infra/Dockerfile.server, target: devfake }
    environment: { APP_ORIGIN: "https://localhost:8443" }
    volumes: [devfake-data:/repo/data]
    expose: ["3000"]
volumes:
  devfake-data:
