# 서버 덮어쓰기 파일의 예시 — 이미 다른 리버스 프록시(nginx·Traefik·Caddy·Nginx Proxy Manager 등)가 호스트의 80·443 을 잡은
# 서버에서 dodok 을 그 뒤에 둔다. 바깥 프록시가 TLS 를 끝내고 이 Stack 의 Caddy 로 HTTP 를 넘긴다. 서버에서 이 파일을
# infra/compose.server.yml 로 복사해 쓰고(그 이름은 .gitignore — 서버마다 다르다) 기본 파일 **뒤에** 붙인다:
#   docker compose -f infra/compose.yml -f infra/compose.server.yml up -d --build
#   (ps·logs·exec·down 도 같은 -f 둘. 앞뒤가 바뀌면 기본 파일이 이 파일을 덮는다)
# 기본 파일의 키를 복사하지 않는다 — 달라지는 키만 쓴다. 기본 파일이 바뀌어도 이 파일을 따라 고칠 일이 없게.
# 바깥 프록시가 갖출 것(WebSocket·Host·X-Forwarded-For·본문 크기)과 손잡이의 뜻은 docs/guides/deploy.md 「기존 리버스 프록시 뒤에 두기」 절
# 값(둘 다 루트 .env — 이 파일은 프록시 종류에 매이지 않는다):
#   DODOK_PROXY_NETWORK    바깥 프록시와 함께 쓰는 Docker 네트워크 이름. 서버에 먼저 있어야 한다(external — 없으면 up 이 멈춘다)
#   DODOK_TRUSTED_PROXIES  바깥 프록시 컨테이너가 그 네트워크에서 갖는 주소(/32, 공백으로 여럿). ⚠ 네트워크 서브넷 전체를 주지
#                          않는다 — 서브넷에는 게이트웨이(.1)가 들고, Docker 가 게시 포트로 들어온 연결을 그 주소에서 온 것처럼 넘기는
#                          경우(Docker Desktop 은 늘, Linux 는 userland-proxy 를 타는 IPv6·루프백 연결) 그 클라이언트가 꾸민 XFF 가
#                          서버에 닿는다. 프록시 주소가 바뀌면(컨테이너를 다시 만들 때) 모든 요청이 그 프록시 주소 하나로 묶인다 —
#                          deploy.md 그 절의 「신뢰 주소」
services:
  caddy:
    # 호스트 포트를 모두 닫는다 — 80·443 은 바깥 프록시 몫이고, 열어 두면 up 이 「port is already allocated」로 멈추거나 프록시를 건너뛰는 길이 생긴다
    ports: !reset []
    environment:
      DODOK_SITE_SCHEME: "http://"
      DODOK_TRUSTED_PROXIES: ${DODOK_TRUSTED_PROXIES:?DODOK_TRUSTED_PROXIES 가 필요하다 — 바깥 프록시 컨테이너의 주소(/32)}
    networks:
      # 서비스에 networks 를 쓰면 적은 것에만 붙는다 — default 가 빠지면 caddy 가 app 에 닿지 못해 모든 /api 가 502 다
      default:
      proxy:
        # 바깥 프록시가 겨눌 이름. 공유 네트워크에서는 서비스 이름 caddy 가 다른 Stack 의 caddy 와 겹쳐 DNS 가 둘을 번갈아 돌려준다
        aliases: [dodok-web]
networks:
  proxy:
    external: true
    name: ${DODOK_PROXY_NETWORK:?DODOK_PROXY_NETWORK 가 필요하다 — 바깥 프록시와 함께 쓰는 Docker 네트워크 이름}
