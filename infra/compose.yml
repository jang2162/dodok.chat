# 운영 Compose(스펙 2.4) — Caddy 가 호스트의 80·443 을 직접 잡고 자동 HTTPS 를 하는 기본 구성. 이미 다른 리버스 프록시가 80·443 을
# 잡은 서버는 이 파일을 고치지 않고 서버 덮어쓰기 파일을 뒤에 붙인다(compose.server.example.yml 머리). 배포 호스트에서 한 번
# `ln -s ../.env infra/.env` 를 하고, 그 뒤 저장소 루트에서:
#   docker compose -f infra/compose.yml up -d --build
# 웹 빌드 ID 는 Dockerfile.web 이 웹 입력의 내용 해시로 만든다. DODOK_WEB_BUILD_ID 를 넘기면 그 값이 이긴다(선택 — 아래 caddy.build.args)
# 링크가 필요한 까닭: compose 는 변수 치환(아래 ${DODOK_DOMAIN})에 첫 -f 파일의 디렉터리(infra/)의 .env 를 읽고 루트 .env 는
# 보지 않는다. 앱 설정은 env_file 이 루트 .env 를 따로 읽으므로 링크가 없으면 DODOK_DOMAIN 만 없다는 오류로 멈춘다.
# 치환은 up 뿐 아니라 ps·logs·exec·down 에서도 돌아서, 링크 대신 --env-file .env 를 쓰면 그 명령마다 붙여야 한다(Komodo 는 그렇게
# 부른다 — docs/guides/deploy-komodo.md)
# pull_policy: build — 두 이미지는 레지스트리에 없고 이 저장소로 빌드한다. 없으면 `up`(--build 없이)·Komodo 배포가 pull 을 시도해
# 실패하거나 호스트에 남은 옛 이미지를 그대로 쓴다
name: dodok
# 로그 로테이션(운영 보강 스펙 2.6) — 서비스마다 10 MB × 5개, 최대 50 MB. 없으면 json-file 로그가 디스크를 끝없이 채운다
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }
services:
  app:
    build: { context: .., dockerfile: infra/Dockerfile.server, target: runtime }
    pull_policy: build
    env_file: ../.env
    # 컨테이너 계약 — 헬스체크·Caddy upstream(3000)·볼륨(/data)·이미지 안 마이그레이션 자리. environment 가 env_file 보다 앞서므로
    # .env 의 같은 이름은 무시된다. 이미지 ENV 로만 두면 .env.example 을 복사한 `HOST=` 같은 빈 줄이 그 값을 빈 문자열로 덮고,
    # 서버는 빈 값을 기본값(127.0.0.1·./data)으로 읽는다 — 헬스체크(컨테이너 안 127.0.0.1)는 초록인데 Caddy 는 502 가 된다
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      DODOK_MIGRATIONS_DIR: /app/drizzle
      DODOK_PLUGIN_DIR: /app/plugin # 이미지가 품은 플러그인 tgz — .env 의 빈 줄이 덮어 「플러그인 파일 없음」이 되지 않게
      DODOK_RUNNER_DIR: /app/runner # 이미지가 품은 러너 tgz — 같은 까닭
      # Caddy 뒤라 레이트리밋·브리지 실패 카운터의 주소는 X-Forwarded-For 를 따라야 한다(Caddy 가 클라이언트 XFF 를 덮는다).
      # .env 의 빈 줄이나 false 가 덮으면 모든 요청이 Caddy 주소 하나로 묶여 한 사람의 폭주가 모두를 막는다
      TRUST_PROXY: "true"
    volumes: [dodok-data:/data]
    # 호스트에 열지 않는다 — Caddy 만 compose 내부 네트워크로 닿는다
    expose: ["3000"]
    restart: unless-stopped
    # 앱의 종료 상한(10초 — PROCESS_EXIT_TIMEOUT_MS·APP_CLOSE_TIMEOUT_MS)보다 길게. Docker 기본 10초면 SIGKILL 이 먼저 와 깨끗한 종료 표지를 못 써 다음 부팅에 unclean_shutdown 이 뜬다
    stop_grace_period: 15s
    logging: *logging
  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      # 비면 Dockerfile.web 이 웹 입력의 내용 해시를 쓴다(그 파일의 「웹 빌드 ID」 주석). 값을 .env 에 고정하지 않는다 — 웹이 바뀌어도
      # ID 가 그대로라 클라이언트가 옛 오프라인 사본을 버리지 않는다
      args: { VITE_BUILD_ID: "${DODOK_WEB_BUILD_ID:-}" }
    pull_policy: build
    environment:
      # 비면 Caddyfile 이 「unrecognized global option」처럼 엉뚱한 오류로 죽는다 — 여기서 먼저 막는다
      DODOK_DOMAIN: ${DODOK_DOMAIN:?DODOK_DOMAIN 이 필요하다 — 루트 .env 에 두고 ln -s ../.env infra/.env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: { app: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging
volumes:
  dodok-data:
  caddy-data:
  caddy-config:
